name: Production CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate environment files
        run: |
          echo "${{ secrets.PRODUCTION_ENV }}" > .env
          echo "${{ secrets.FIREBASE_CONF }}" > firebase.json

      - name: Build the app
        run: npm run build

      - name: Prepare deployment bundle
        run: |
          mkdir deploy_bundle
          cp -r dist public templates test package.json package-lock.json .env firebase.json knexfile.js pm2.json deploy_bundle/
          cd deploy_bundle && tar -czf ../deploy_bundle.tar.gz .

      - name: Confirm lockfile exists
        run: ls deploy_bundle/package-lock.json

      - name: Deploy with Ansible
        run: |
          cd ansible
          echo "${{ secrets.PRODUCTION_SERVER_SSH_KEY }}" > id_rsa
          chmod 400 id_rsa
          ansible-playbook deploy.yml \
            -i inventory \
            --extra-vars "target=production bundle_file_path=../deploy_bundle.tar.gz" \
            --private-key=id_rsa
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
